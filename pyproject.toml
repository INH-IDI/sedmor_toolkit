[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sedmor"
version = "0.1.0"
description = "Libreria educativa independiente en Python para hidrodinamica costera y fluvial, transporte de sedimentos, run-up, rebase, escolleras y morfodinamica."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
  { name = "Instituto Nacional de Hidraulica (INH-IDI) y contribuidores de sedmor", email = "i-d-i@inh.cl" },
]
keywords = [
  "sediment-transport",
  "coastal-engineering",
  "fluvial-hydraulics",
  "morphodynamics",
  "wave-runup",
  "wave-overtopping",
  "rock-armor",
  "hydrodynamics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/INH-IDI/sedmor_toolkit"
Repository = "https://github.com/INH-IDI/sedmor_toolkit"
Issues = "https://github.com/INH-IDI/sedmor_toolkit/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "build>=1.0",
]
examples = [
  "matplotlib>=3.7",
  "jupyter>=1.0",
  "ipykernel>=6.0",
  "nbconvert>=7.0",
]
all = [
  "sedmor[dev,examples]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
